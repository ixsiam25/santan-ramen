<svg viewBox="0 0 900 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="らぁ麺 三湯 SANTAN logo">
  <defs>
    <style>
      .ink { fill: #1C1712; }
      .wordmark { font-family: 'Shippori Mincho B1', serif; font-weight: 800; fill: #1C1712; }
      .santan { font-family: 'Cormorant Garamond', serif; font-weight: 600; letter-spacing: 14px; fill: #1C1712; }
      .oita { font-family: 'Shippori Mincho B1', serif; font-weight: 700; fill: #1C1712; }
    </style>
  </defs>

  <!-- bowl + chopsticks + Oita mark -->
  <g transform="translate(20,60)">
    <text x="18" y="72" class="oita" font-size="46" transform="rotate(-6 18 72)">大分</text>
    <line x1="4" y1="98" x2="150" y2="70" stroke="#1C1712" stroke-width="4" stroke-linecap="round"/>
    <line x1="10" y1="108" x2="156" y2="80" stroke="#1C1712" stroke-width="4" stroke-linecap="round"/>
    <path d="M18 118 a58 58 0 0 0 116 0 z" fill="none" stroke="#1C1712" stroke-width="4"/>
    <path d="M18 118 h116" stroke="#1C1712" stroke-width="4"/>
    <g stroke="#1C1712" stroke-width="3.2" fill="none">
      <path d="M30 128 q8 -9 16 0 q8 9 16 0 q8 -9 16 0 q8 9 16 0 q8 -9 16 0"/>
      <path d="M26 140 q8 -9 16 0 q8 9 16 0 q8 -9 16 0 q8 9 16 0 q8 -9 16 0 q8 9 12 2"/>
    </g>
  </g>

  <!-- 三 -->
  <g class="ink">
    <path d="M270 96 q60 -10 130 -2 q10 1 8 11 q-2 9 -12 8 q-64 -7 -122 3 q-10 2 -11 -8 q-1 -9 7 -12 z"/>
    <path d="M262 168 q75 -9 150 0 q11 1 9 12 q-2 10 -13 9 q-70 -8 -142 1 q-11 1 -12 -9 q-1 -11 8 -13 z"/>
    <path d="M252 240 q95 -12 190 2 q12 2 10 13 q-3 11 -15 9 q-88 -13 -178 -1 q-12 2 -14 -10 q-2 -11 7 -13 z"/>
  </g>

  <!-- 湯 -->
  <text x="470" y="255" class="wordmark" font-size="200">湯</text>
  <path d="M660 78 q10 -14 22 -6 q9 7 2 18 q-9 13 -22 6 q-9 -6 -2 -18 z" fill="#C0392B"/>

  <!-- SANTAN -->
  <text x="450" y="308" text-anchor="middle" class="santan" font-size="40">SANTAN</text>

  <!-- 麺 stamp -->
  <g transform="translate(790,150) rotate(-4)">
    <path d="M2 4 q-4 40 2 78 q2 10 12 10 q42 4 78 -2 q10 -2 9 -12 q-4 -40 -1 -76 q1 -10 -9 -11 q-42 -6 -80 1 q-9 2 -11 12 z" fill="#C0392B"/>
    <text x="46" y="60" text-anchor="middle" font-family="'Shippori Mincho B1', serif" font-weight="800" font-size="48" fill="#FBF8F1">麺</text>
  </g>
</svg>
